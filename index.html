<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BYISHIMO TECH - Receipt Verification</title>

<style>
body {
    margin: 0;
    padding: 20px;
    background: #0b1223;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 450px;
    margin: 40px auto;
    padding: 25px;
    background: #17243b;
    border-radius: 15px;
    text-align: center;
}

h1 {
    color: #00aaff;
}

input {
    width: 90%;
    padding: 14px;
    margin: 15px 0;
    border-radius: 8px;
    border: none;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    background: #008cff;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
}

#result {
    margin-top: 20px;
    line-height: 1.6;
}

.footer {
    margin-top: 30px;
    color: #aaa;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

<h1>BYISHIMO TECH</h1>

<h3>PAYMENT RECEIPT VERIFICATION</h3>

<p>Enter your receipt transaction ID below.</p>

<input
    type="text"
    id="transactionId"
    placeholder="Enter Transaction ID">

<button onclick="verifyReceipt()">
VERIFY RECEIPT
</button>

<div id="result">
    Verification service is being configured.
</div>

<div class="footer">
    BYISHIMO TECH ADMINISTRATION<br>
    Official Receipt Verification Portal
</div>

</div>

<script>
function verifyReceipt() {

    const id = document.getElementById("transactionId")
        .value.trim();

    const result = document.getElementById("result");

    if (id === "") {
        result.innerHTML = "Please enter a transaction ID.";
        return;
    }

    result.innerHTML =
        "Verification service is not connected yet. Please try again later.";
}
</script>

</body>
</html>
